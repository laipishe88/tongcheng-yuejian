<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>同城见面</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#7b818a;--line:#eceef1;--brand:#111;--accent:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{border:0}.app{width:min(100%,480px);margin:auto;min-height:100vh;background:var(--bg)}header{position:sticky;top:0;z-index:4;background:rgba(245,246,248,.94);backdrop-filter:blur(14px);padding:18px 18px 10px;border-bottom:1px solid var(--line)}.title{font-size:27px;font-weight:750}.sub{color:var(--muted);margin-top:4px;font-size:13px}.toplink{margin-top:14px;background:#111;color:white;border-radius:18px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.toplink b{font-size:16px}.toplink small{opacity:.72}.content{padding:14px 16px 92px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(20,24,30,.04)}.row{display:flex;gap:10px;align-items:center}.space{justify-content:space-between}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ddd,#aaa);font-weight:700}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#f2f3f5;color:#555;font-size:12px;margin:4px 4px 0 0}.pill.on{background:#111;color:#fff}.btn{background:#111;color:#fff;padding:11px 14px;border-radius:14px;font-weight:650}.btn.alt{background:#f0f1f3;color:#222}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.place{min-height:155px;background:linear-gradient(145deg,#ddd,#b9bcc2);border-radius:18px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden}.place:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.48))}.place>*{position:relative;z-index:1}.section-title{font-size:18px;font-weight:750;margin:18px 0 10px}.meta{font-size:12px;color:var(--muted);line-height:1.7}.match-score{font-size:28px;font-weight:800}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:5}.tab{background:none;color:#858b93;padding:7px 4px}.tab.on{color:#111;font-weight:750}.hidden{display:none}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fafafa;outline:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:end;justify-content:center;z-index:10}.sheet{width:min(100%,480px);background:#fff;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.close{float:right;background:#f1f2f4;border-radius:50%;width:32px;height:32px}.notice{padding:12px 14px;border-radius:14px;background:#fff7ef;color:#8b4a18;font-size:12px;margin-bottom:12px}
</style></head><body><div class="app"><header><div class="title">同城见面</div><div class="sub">现在想见谁，一起去哪里，直接安排好</div><div class="toplink"><div><b>发现附近休闲娱乐场所</b><br><small>棋牌 · 桌游 · 台球 · KTV · 咖啡</small></div><span>›</span></div></header><main class="content"><section id="home"></section><section id="match" class="hidden"></section><section id="groups" class="hidden"></section><section id="me" class="hidden"></section></main><nav class="tabs"><button class="tab on" onclick="show('home')">发现</button><button class="tab" onclick="show('match')">匹配</button><button class="tab" onclick="show('groups')">组局</button><button class="tab" onclick="show('me')">我的</button></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const users=[{n:'林夕',age:25,sex:'女',km:1.8,acts:['聊天','吃饭','散步'],time:'19:00-23:00',score:98},{n:'阿杰',age:24,sex:'男',km:2.4,acts:['麻将','桌游'],time:'20:00-23:30',score:95},{n:'小满',age:27,sex:'女',km:4.1,acts:['逛街','咖啡'],time:'18:30-22:00',score:91}];
const venues=[{n:'松果棋牌会所',t:'棋牌',km:2.4,p:'麻将包间 ¥68 / 2小时',tags:['麻将','休闲']},{n:'木马桌游社',t:'桌游',km:3.1,p:'桌游畅玩 ¥39 / 人',tags:['桌游','组局']},{n:'星球台球馆',t:'台球',km:4.3,p:'标准台 ¥48 / 小时',tags:['台球','夜场']},{n:'漫时咖啡',t:'咖啡',km:2.9,p:'双人套餐 ¥79',tags:['聊天','约会']}];
const groups=[{name:'今晚20:00 4人麻将',type:'麻将',n:2,max:4,km:1.7,time:'今天 20:00'},{name:'周五夜桌游局',type:'桌游',n:3,max:6,km:3.2,time:'周五 19:30'},{name:'下班台球搭子',type:'台球',n:1,max:4,km:4.6,time:'今天 19:00'}];
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('on',['home','match','groups','me'].indexOf(id)===i));render(id)}
function render(id){if(id==='home')home();if(id==='match')match();if(id==='groups')groupPage();if(id==='me')me()}
function home(){document.getElementById('home').innerHTML=`<div class="notice">附近范围：10km　·　今晚有 8 个活跃组局　·　3 家合作场所有可预约项目</div><div class="section-title">现在想干什么？</div><div class="card"><div>${['约会','聊天','吃饭','打麻将','桌游','台球','逛街','陪伴'].map(x=>`<span class="pill" onclick="this.classList.toggle('on')">${x}</span>`).join('')}</div><div class="row space" style="margin-top:14px"><div class="meta">时间：今天 19:00以后<br>距离：5km内</div><button class="btn" onclick="show('match')">开始匹配</button></div></div><div class="section-title">附近高匹配</div>${users.map(u=>`<div class="card"><div class="row space"><div class="row"><div class="avatar">${u.n[0]}</div><div><b>${u.n} · ${u.age}</b><div class="meta">${u.km}km · ${u.time}</div></div></div><div class="match-score">${u.score}<span style="font-size:12px">%</span></div></div><div style="margin:10px 0">${u.acts.map(a=>`<span class="pill">${a}</span>`).join('')}</div><button class="btn" onclick="invite('${u.n}')">发起邀约</button></div>`).join('')}<div class="section-title">附近推荐场所</div><div class="grid">${venues.slice(0,2).map(v=>venueCard(v)).join('')}</div>`}
function match(){document.getElementById('match').innerHTML=`<div class="section-title">精准匹配</div><div class="card"><div class="grid"><div class="field"><label>性别</label><select><option>不限</option><option>女</option><option>男</option></select></div><div class="field"><label>年龄</label><select><option>22-30</option><option>18-25</option><option>25-35</option></select></div><div class="field"><label>范围</label><select><option>5km</option><option>10km</option><option>20km</option></select></div><div class="field"><label>时间</label><select><option>今天晚上</option><option>现在</option><option>明天</option></select></div></div><div class="field"><label>想做什么</label>${['约会','聊天','麻将','桌游','台球','逛街'].map(x=>`<span class="pill" onclick="this.classList.toggle('on')">${x}</span>`).join('')}</div><button class="btn" onclick="alert('匹配完成：找到 12 位候选人，其中 4 位时间完全重合。')">重新匹配</button></div><div class="section-title">推荐结果</div>${users.map(u=>`<div class="card"><div class="row space"><b>${u.n} · ${u.age}岁</b><strong>${u.score}%</strong></div><div class="meta">${u.km}km · ${u.time}</div><div>${u.acts.map(a=>`<span class="pill">${a}</span>`).join('')}</div><button class="btn" style="margin-top:10px" onclick="invite('${u.n}')">约 TA</button></div>`).join('')}`}
function groupPage(){document.getElementById('groups').innerHTML=`<div class="row space"><div class="section-title" style="margin:8px 0">附近组局</div><button class="btn" onclick="createGroup()">+ 发起组局</button></div><div class="card">${['全部','麻将','桌游','台球','吃饭','逛街'].map((x,i)=>`<span class="pill ${i===0?'on':''}" onclick="this.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));this.classList.add('on')">${x}</span>`).join('')}</div>${groups.map(g=>`<div class="card"><div class="row space"><div><b>${g.name}</b><div class="meta">${g.time} · ${g.km}km</div></div><span class="pill">${g.type}</span></div><div style="margin:10px 0"><b>${g.n}</b> / ${g.max} 人</div><div class="meta">发起人已通过资料审核 · 加入前可查看组局地点</div><button class="btn" style="margin-top:10px" onclick="joinGroup('${g.name}')">申请加入</button></div>`).join('')}`}
function me(){document.getElementById('me').innerHTML=`<div class="card"><div class="row"><div class="avatar" style="width:58px;height:58px">我</div><div><b>体验用户</b><div class="meta">资料状态：待完善 · 实名状态：未认证</div></div></div></div><div class="card"><b>安全与认证</b><div class="meta" style="margin-top:8px">正式版将接入微信登录、手机号授权、实名认证、定位权限和后台审核。</div><button class="btn alt" style="margin-top:10px" onclick="alert('演示版：这里将进入微信登录/实名认证流程。')">去认证</button></div><div class="card"><b>我的预约</b><div class="meta" style="margin-top:8px">暂无真实订单。体验预约会保存在本次演示中。</div></div>`}
function venueCard(v){return `<div class="place" onclick="venue('${v.n}')"><small>${v.t} · ${v.km}km</small><b>${v.n}</b><span style="font-size:12px">${v.p}</span></div>`}
function showVenues(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>附近合作场所</h2><p class="meta">由平台后台维护合作商家，用户可以直接查看项目与预约。</p>${venues.map(v=>`<div class="card"><div class="row space"><div><b>${v.n}</b><div class="meta">${v.t} · ${v.km}km</div></div><button class="btn" onclick="venue('${v.n}')">查看</button></div><div style="margin-top:8px">${v.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div style="margin-top:8px">${v.p}</div></div>`).join('')}`)}
function venue(n){const v=venues.find(x=>x.n===n);showModal(`<button class="close" onclick="closeModal()">×</button><h2>${v.n}</h2><div class="meta">${v.t} · ${v.km}km</div><div class="card"><b>${v.p}</b><div class="field"><label>预约时间</label><select><option>今天 19:30</option><option>今天 20:00</option><option>今天 20:30</option></select></div><button class="btn" onclick="alert('演示预约成功：${v.n}；正式版将进入真实订单、支付和商家核销。')">立即预约</button></div>`)}
function invite(n){alert('已向 '+n+' 发出见面邀约。对方接受后可继续聊天并选择线下场所。')}function joinGroup(n){alert('已申请加入“'+n+'”。正式版将进入组局审核/入局流程。')}function createGroup(){showModal(`<button class="close" onclick="closeModal()">×</button><h2>发起组局</h2><div class="field"><label>组局标题</label><input id="gn" placeholder="例如：今晚20点4人麻将"></div><div class="field"><label>活动</label><select id="gt"><option>麻将</option><option>桌游</option><option>台球</option><option>吃饭</option><option>逛街</option></select></div><div class="field"><label>时间</label><input type="datetime-local" id="gtime"></div><div class="field"><label>人数上限</label><input type="number" id="gmax" value="4" min="2" max="20"></div><button class="btn" onclick="addGroup()">发布组局</button>`)}function addGroup(){const n=document.getElementById('gn').value||'我的新组局';groups.unshift({name:n,type:document.getElementById('gt').value,n:1,max:+document.getElementById('gmax').value||4,km:0.8,time:'今天'});closeModal();render('groups');alert('组局已发布（本地演示）。正式版发布前需完成资料审核。')}function showModal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}document.querySelector('.toplink').onclick=showVenues;show('home');
</script></body></html>
